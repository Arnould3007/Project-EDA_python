[project]
name = "spain-electricity-weather"
version = "0.1.0"
description = "Do wind and sunshine conditions explain electricity price level and volatility in Spain, and is a spot-indexed contract worth the risk for an SME?"
readme = "README.md"
authors = [
    { name = "Arnould", email = "aleveque@albertschool.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[project.scripts]
spain-electricity-weather = "spain_electricity_weather:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
# strict = true already implies disallow_untyped_defs; pandas-stubs and
# types-requests cover our two external dependencies, so no blanket
# ignore_missing_imports is needed. If an untyped library shows up later,
# add a scoped [[tool.mypy.overrides]] for that one module, with a reason.
